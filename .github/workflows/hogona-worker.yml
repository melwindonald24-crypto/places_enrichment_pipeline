name: Hogona State CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct SQLite state
        run: |
          python - <<'PY'
          import base64, gzip, sqlite3
          raw=base64.b64decode(open('data/hogona_worker.sql.gz.b64','rb').read())
          sql=gzip.decompress(raw).decode('utf-8')
          con=sqlite3.connect('hogona_worker.sqlite')
          con.executescript(sql)
          con.close()
          PY
      - name: Validate state
        run: python tests/test_worker.py
