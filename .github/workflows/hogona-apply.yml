name: Hogona Apply Research

on:
  push:
    branches: [main]
    paths:
      - 'worker/response.json'
      - 'worker/bridge.py'
  workflow_dispatch:

concurrency:
  group: hogona-handoff
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply researched batch
        if: ${{ hashFiles('worker/response.json') != '' }}
        run: HOGONA_BRIDGE_MODE=apply python worker/bridge.py
      - name: Persist canonical state and clear handoff
        if: ${{ hashFiles('worker/response.json') != '' }}
        run: |
          git config user.name 'hogona-worker'
          git config user.email 'hogona-worker@users.noreply.github.com'
          git add data/hogona_worker_canonical_state.sql.gz.b64
          git rm -f worker/response.json worker/request.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Hogona batch results'
            git push
          fi
